<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>PrismLLM</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header>
    <button id="menu" aria-label="Chats">☰</button>
    <button id="picker"><span id="pickerLabel">Auto-Failover</span> ▾</button>
    <button id="settings" aria-label="Settings">⚙</button>
  </header>
  <main id="msgs"></main>
  <footer>
    <textarea id="input" rows="1" placeholder="Message PrismLLM"></textarea>
    <button id="send" aria-label="Send">↑</button>
  </footer>
</div>
<aside id="drawer" hidden></aside>
<div id="sheet" hidden></div>
<script src="app.js"></script>
</body>
</html>
