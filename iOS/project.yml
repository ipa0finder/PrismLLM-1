name: PrismLLM
options:
  bundleIdPrefix: com.prismllm
  deploymentTarget:
    iOS: "16.0"
targets:
  PrismLLM:
    type: application
    platform: iOS
    sources:
      - path: PrismLLM
        excludes: ["Web"]
      - path: PrismLLM/Web
        type: folder
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: PrismLLM
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prismllm.app
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1
